name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (a commit SHA, or 'latest'). Use this to roll back."
        required: false
        default: latest

# packages:write also grants the read access the VPS needs to pull with this
# job's ephemeral token, so no long-lived registry PAT has to live on the box.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/senotify/mild
  CONTAINER: mild
  HOSTNAME: mild.senotify.com

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # A manual run with an explicit SHA is a rollback: that image already exists.
      - id: pick
        run: |
          t="${{ github.event.inputs.tag }}"
          if [ -n "$t" ] && [ "$t" != "latest" ]; then
            echo "tag=$t" >> "$GITHUB_OUTPUT"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pick.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - if: steps.pick.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - if: steps.pick.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$USER@$HOST" \
            IMAGE='${{ env.IMAGE }}' CONTAINER='${{ env.CONTAINER }}' \
            TAG="$TAG" TOKEN="$TOKEN" ACTOR="$ACTOR" 'bash -euo pipefail -s' <<'REMOTE'
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker pull "$IMAGE:$TAG"
            docker rm -f "$CONTAINER" 2>/dev/null || true
            # The SQLite DB and uploads live in the mild-data volume, which
            # outlives every redeploy. 384MB is plenty for one Next.js process.
            docker run -d --name "$CONTAINER" \
              --network proxy-network --restart unless-stopped \
              --memory 384m \
              -v mild-data:/data \
              "$IMAGE:$TAG"

            docker image prune -f >/dev/null 2>&1 || true
            echo "deployed $CONTAINER from $IMAGE:$TAG"
          REMOTE

      - name: Verify site is serving
        run: |
          set -euo pipefail
          H='${{ env.HOSTNAME }}'
          for i in $(seq 1 12); do
            code=$(curl -sS -m 20 --resolve "$H:443:${{ secrets.VPS_HOST }}" -o /dev/null -w '%{http_code}' "https://$H/" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              sm=$(curl -sS -m 20 --resolve "$H:443:${{ secrets.VPS_HOST }}" "https://$H/sitemap.xml" || true)
              if grep -q '<urlset' <<<"$sm"; then echo "sitemap OK"; exit 0; fi
              echo "sitemap missing"; exit 1
            fi
            sleep 6
          done
          echo "site did not return 200 after deploy"; exit 1
